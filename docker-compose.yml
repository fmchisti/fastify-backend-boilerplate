# Local development services. Start with `pnpm db:up`, stop with `pnpm db:down`.
services:
  # @setup-if orm!=none
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
  # @setup-endif

  # @setup-if redis=redis
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # @setup-endif

  # @setup-if storage=s3
  # S3-compatible storage for local development:
  #   S3_ENDPOINT=http://localhost:9000 S3_FORCE_PATH_STYLE=true
  #   S3_ACCESS_KEY_ID=minioadmin S3_SECRET_ACCESS_KEY=minioadmin S3_BUCKET=app
  # Console: http://localhost:9001 (create the bucket there). Start with: docker compose --profile minio up -d
  minio:
    image: minio/minio:latest
    profiles: [minio]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  # @setup-endif

# @setup-if orm!=none|storage=s3
volumes:
  # @setup-if orm!=none
  postgres-data:
  # @setup-endif
  # @setup-if storage=s3
  minio-data:
  # @setup-endif
# @setup-endif
